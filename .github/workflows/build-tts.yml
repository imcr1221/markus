name: Build TTS and Deploy

on:
  push:
    paths:
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 👇 就是这里，必须安装这两个包
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 edge-tts

      - name: Run audio generation script
        # 这里加了 timeout 防止卡死
        run: timeout 600 python generate_audio.py || echo "脚本超时或出错，继续提交已生成的文件"

      - name: Commit and push generated audio files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add */audio/
          git commit -m "Auto-generate audio files" || exit 0
          git pull --rebase origin main
          git push
