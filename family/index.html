 .hide-controls{justify-content:space-between;gap:clamp(35px,10vw,140px)}.hide-controls .btn{flex:0 1 auto} </style><script src="audio/tts-manifest.js"></script></head><body><header><div><h1>🏡 我的家人</h1><div class="subtitle">看一看 · 听一听 · 找一找 · 玩一玩</div></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"><a class="home" href="../index.html" style="text-decoration:none;color:var(--ink);display:inline-flex;align-items:center">← 返回上层目录</a><button class="home" onclick="switchTab('learn')">🏠 首页</button></div></header><nav class="tabs" id="tabs"></nav><main>
<section id="learn" class="panel active"><h2>👋 认识我的家人</h2><p class="hint">点一张照片，听一听他是谁。</p><div class="grid" id="people"></div><div class="bar"><button class="btn" data-tts-text="这是妈妈。这是爸爸。这是哥哥。这是姐姐。这是弟弟。这是妹妹。这是爷爷。这是奶奶。" onclick="say(this.dataset.ttsText)">🔊 全部听一遍</button></div></section>
<section id="listen" class="panel"><h2>👂 听音找家人</h2><p class="hint">听问题，从三张图片里选出正确的家人。</p><div class="question" id="listenQuestion">准备好了吗？</div><button class="btn primary" id="listenSound" onclick="say('谁是'+current.answer+'？')">🔊 听题目</button><div class="choices" id="listenChoices" style="margin-top:20px"></div><p class="feedback" id="listenFeedback" aria-live="polite"></p><div class="bar"><button class="btn" onclick="prevQuiz()">⬅ 上一题</button><button class="btn primary" onclick="nextQuiz()">下一题 ➜</button></div></section>
<section id="find" class="panel"><h2>🔎 找一找</h2><p class="hint">八位家人都在这里，仔细听，找一找！</p><div class="question" id="findQuestion"></div><button class="btn" onclick="say(findNames[findIdx]+'在哪里？')">🔊 再听一遍</button><div class="find-scene"><img src="assets/slide24.jpg" alt="八位家人在花园里玩捉迷藏"><div id="findPeople"></div></div><p class="feedback" id="findFeedback"></p><div class="bar"><button class="btn" onclick="prevFind()">⬅ 上一题</button><button class="btn primary" onclick="advanceFind()">下一题 ➜</button></div></section>
<section id="compare" class="panel"><h2>📏 比一比</h2><p class="hint">听问题，看图片，说一说。</p><img class="scene" id="compareImage" src="assets/slide20.jpg" alt="家人比高矮"><div class="sceneBtns"><button class="btn" data-tts-text="比一比，谁高？谁矮？" onclick="say('比一比，谁高？谁矮？')">🔊 谁高谁矮？</button><button class="btn" data-tts-text="谁是哥哥？谁是弟弟？" onclick="say('谁是哥哥？谁是弟弟？')">🔊 哥哥和弟弟</button><button class="btn" data-tts-text="谁是姐姐？谁是妹妹？" onclick="say('谁是姐姐？谁是妹妹？')">🔊 姐姐和妹妹</button></div></section>
<section id="gift" class="panel"><h2>🎁 给家人送礼物</h2><p class="hint">听问题，先选礼物，再选一位家人。</p><button class="btn" onclick="say('你想把礼物送给谁？')" data-tts-text="你想把礼物送给谁？">🔊 听题目</button><div class="sceneBtns" id="gifts"><button class="gift" onclick="pickGift('鲜花',this)" aria-label="鲜花">💐</button><button class="gift" onclick="pickGift('礼物',this)" aria-label="礼物">🎁</button><button class="gift" onclick="pickGift('贺卡',this)" aria-label="贺卡">💌</button></div><div class="grid" id="giftPeople" style="margin-top:20px"></div><p class="feedback" id="giftFeedback"></p></section>
<section id="hidegame" class="panel"><h2>🔍 谁不见了？</h2><p class="hint">仔细看一看，谁不见了？</p><button class="btn" onclick="say('谁不见了？')" data-tts-text="谁不见了？">🔊 听题目</button><div class="grid" id="hidePeople"></div><div class="bar hide-controls"><button class="btn primary" onclick="hideOne()" data-tts-text="下一题">下一题 ➜ 🔊</button><button class="btn" onclick="reveal()" data-tts-text="看答案">👀 看答案 🔊</button></div><p class="feedback" id="hideFeedback"></p></section>
<section id="move" class="panel"><h2>🏃 动起来！</h2><p class="hint">听一听，选出正在做动作的家人。</p><div class="question" id="moveText">谁在拍手？</div><div class="bar"><button class="btn primary" onclick="say(moves[moveIdx][0])" id="moveSound">🔊 再听一遍</button></div><div class="choices" id="moveChoices"></div><p class="feedback" id="moveFeedback" aria-live="polite"></p><div class="bar"><button class="btn" onclick="prevMove()">⬅ 上一题</button><button class="btn primary" onclick="nextMove()">下一题 ➜</button></div></section>
</main><script>
const people=[['妈妈',6],['爸爸',7],['哥哥',9],['姐姐',10],['弟弟',11],['妹妹',12],['爷爷',15],['奶奶',16]];const tabs=[['learn','认识家人'],['listen','听音找图'],['find','找一找'],['compare','比一比'],['gift','送礼物'],['hidegame','谁不见了？'],['move','动起来']];let quizHistory=[],quizIndex=-1;let current={},findIdx=0,findNames=[],gift='礼物',hidden=-1,moveIdx=0;const moves=[['谁在拍手？','👏'],['谁在抬腿？','🦵'],['谁在跺脚？','👣'],['谁在捂眼睛？','🙈'],['谁在捂耳朵？','🙉'],['谁在挥手？','👋']];
function say(t){if(!t)return;let key=t;let audio=window.TTS_AUDIO?.[key];if(audio){let a=new Audio("audio/"+audio);a.play().catch(()=>fallback(t));return}fallback(t)}function fallback(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.82;speechSynthesis.speak(u)}
function personCard(p,cb,show=true){let b=document.createElement('button');b.className='person';b.innerHTML=`<img src="assets/person${p[1]}.jpg" alt="${p[0]}">${show?`<strong>${p[0]}</strong><small>🔊 点我听一听</small>`:''}`;b.dataset.ttsText=p[0]+'，这是'+p[0];b.onclick=()=>cb(p,b);return b}
function switchTab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='listen'&&!current.answer)nextQuiz();if(id==='find'&&!findNames.length)nextFind();if(id==='compare')say('比一比，谁高？谁矮？');if(id==='gift')say('你想把礼物送给谁？');if(id==='hidegame')say('谁不见了？');if(id==='move')renderMove();window.scrollTo({top:0,behavior:'smooth'})}
let tabEl=document.getElementById('tabs');tabs.forEach(([id,t])=>{let b=document.createElement('button');b.textContent=t;b.dataset.tab=id;b.onclick=()=>switchTab(id);tabEl.append(b)});document.querySelector('[data-tab="learn"]').classList.add('active');people.forEach(p=>document.getElementById('people').append(personCard(p,()=>say(p[0]+'，这是'+p[0]))));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function nextQuiz(){if(quizIndex<quizHistory.length-1){quizIndex++}else{let arr=shuffle(people).slice(0,3);quizHistory.push({arr,answer:arr[Math.floor(Math.random()*3)][0]});quizIndex++}renderQuiz()}function prevQuiz(){if(quizIndex>0){quizIndex--;renderQuiz()}}function renderQuiz(){let {arr,answer}=quizHistory[quizIndex];current={answer,locked:false};document.getElementById('listenQuestion').textContent='听一听，选一选。';document.getElementById('listenSound').dataset.ttsText='谁是'+current.answer+'？';document.getElementById('listenFeedback').textContent='';let root=document.getElementById('listenChoices');root.innerHTML='';arr.forEach(p=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<img src="assets/person${p[1]}.jpg" alt="家人照片">`;b.onclick=()=>{if(current.locked)return;if(p[0]===current.answer){current.locked=true;b.classList.add('good');document.getElementById('listenFeedback').textContent=p[0]+'！答对了，你真棒！';say(p[0]+'！答对了，你真棒！')}else{b.classList.add('bad');document.getElementById('listenFeedback').textContent='再试一次！';say('再试一次！')}};root.append(b)});say('谁是'+current.answer+'？')}document.getElementById('listenSound').onclick=()=>say('谁是'+current.answer+'？');
const findSpots=[
  {name:'爸爸',x:10,y:33,w:18,h:38},
  {name:'爷爷',x:24,y:26,w:15,h:22},
  {name:'奶奶',x:22,y:55,w:18,h:33},
  {name:'哥哥',x:45,y:27,w:13,h:20},
  {name:'姐姐',x:58,y:39,w:16,h:21},
  {name:'妹妹',x:59,y:59,w:17,h:22},
  {name:'妈妈',x:92,y:28,w:16,h:30},
  {name:'弟弟',x:87,y:61,w:15,h:34}
];
let findLocked=false;
function nextFind(){findNames=shuffle(people.map(p=>p[0]));findIdx=0;renderFind()}function advanceFind(){if(findIdx>=findNames.length-1){findNames.push(...shuffle(people.map(p=>p[0])))}findIdx++;renderFind()}function prevFind(){if(findIdx>0){findIdx--;renderFind()}}
function renderFind(){
  const name=findNames[findIdx];findLocked=false;
  document.getElementById('findQuestion').textContent=name+'在哪里？';
  const root=document.getElementById('findPeople');root.innerHTML='';
  document.getElementById('findFeedback').textContent='';
  findSpots.forEach(spot=>{
    const b=document.createElement('button');b.type='button';b.className='find-spot';
    b.style.left=spot.x+'%';b.style.top=spot.y+'%';b.style.width=spot.w+'%';b.style.height=spot.h+'%';
    b.setAttribute('aria-label','选择图中的人物');
    b.onclick=()=>{
      if(findLocked)return;
      if(spot.name===name){findLocked=true;b.classList.add('good');
        const t='找到了！'+name+'，这是'+name+'！';
        document.getElementById('findFeedback').textContent=t;say(t);
      }else{b.classList.add('bad');document.getElementById('findFeedback').textContent='再找一找！';say('再找一找！');setTimeout(()=>b.classList.remove('bad'),700)}
    };
    root.append(b);
  });
  say(name+'在哪里？');
}

document.querySelector('#find .btn:not(.primary)').onclick=()=>say(findNames[findIdx]+'在哪里？');
function pickGift(g,b){gift=g;document.querySelectorAll('.gift').forEach(x=>x.classList.toggle('selected',x===b));say('我选'+g+'。你想把礼物送给谁？')}document.querySelector('.gift:nth-child(2)').classList.add('selected');people.forEach(p=>document.getElementById('giftPeople').append(personCard(p,()=>{let t='把'+gift+'送给'+p[0]+'！';document.getElementById('giftFeedback').textContent=t;say(t)},false)));
function sayInOrder(lines){
  if(!lines.length)return;
  const t=lines[0],audio=window.TTS_AUDIO?.[t];
  const next=()=>sayInOrder(lines.slice(1));
  if(audio){const a=new Audio("audio/"+audio);a.onended=next;a.onerror=()=>speakThen(t,next);a.play().catch(()=>speakThen(t,next));}
  else speakThen(t,next);
}
function speakThen(t,done){
  if(!('speechSynthesis' in window)){done();return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.82;
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
}
function hideOne(){
  hidden=Math.floor(Math.random()*people.length);renderHide();
  document.getElementById('hideFeedback').textContent='谁不见了？';
  sayInOrder(['下一题','谁不见了？']);
}
function reveal(){
  if(hidden<0){say('看答案');return;}
  const t='是'+people[hidden][0]+'！';
  document.getElementById('hideFeedback').textContent=t;
  hidden=-1;renderHide();
  sayInOrder(['看答案',t]);
