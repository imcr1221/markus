<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>认识五官｜中文互动复习</title><style>
:root{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;color:#29465b;background:#f2faff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#d6f3ff,#fff1d8);padding:24px 16px;text-align:center}h1{margin:0;font-size:clamp(28px,5vw,44px)}header p{margin:8px 0 0}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px;position:sticky;top:0;background:#f2faffed;z-index:5}button{font:inherit;cursor:pointer;border:2px solid #c9e3ef;border-radius:16px;background:white;padding:12px 17px;color:#27526a}button:hover{border-color:#67b5d6}button.active,.primary{background:#3b9ecb;color:white;border-color:#3b9ecb}.wrap{max-width:1000px;margin:12px auto 50px;padding:0 16px}.panel{background:white;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:0 8px 25px #a5c5d32a;min-height:450px}.hide{display:none}.lead{text-align:center;color:#5a7180}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.tile{border:2px solid #e0edf2;border-radius:20px;padding:12px;text-align:center;background:#fff;min-width:0}.tile img{width:100%;height:180px;object-fit:contain;border-radius:12px}.tile h3{font-size:25px;margin:8px 0}.muted{color:#647c89}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.prompt{font-size:clamp(24px,4vw,36px);font-weight:700;text-align:center;margin:18px 0}.feedback{min-height:38px;text-align:center;font-size:23px;font-weight:bold;color:#237b6c}.choice{transition:transform .15s}.choice:active{transform:scale(.97)}.choice.correct{border-color:#42b78b;background:#e9fff2}.choice.wrong{border-color:#ed9a8b;background:#fff2ee}.word{font-size:24px;font-weight:700}.small{font-size:15px}.face{display:block;max-width:370px;width:100%;max-height:330px;object-fit:contain;margin:auto}.progress{text-align:center;color:#6d8796}.sentence{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.sentence button{font-size:23px}.footer{text-align:center;padding:15px;color:#7b94a1}@media(max-width:550px){.tile img{height:130px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:16px}nav button{padding:9px 11px;font-size:14px}}
 .face-game{display:grid;grid-template-columns:minmax(0,2fr) minmax(130px,1fr);gap:22px;align-items:center;max-width:690px;margin:20px auto}.face-stage{position:relative;max-width:390px;margin:auto;background:linear-gradient(#e9f8ff,#fff6e8);border-radius:28px;padding:12px;width:100%}.face-stage svg{display:block;width:100%}.dropzone{position:absolute;cursor:pointer;border:2px dashed #85bfd1;border-radius:40px;display:flex;align-items:center;justify-content:center;color:#b7dbe5;background:#ffffff50;font-size:48px}.dropzone.placed{border-color:transparent;background:transparent}.eyes{left:27%;top:40%;width:46%;height:16%}.nose{left:43%;top:55%;width:14%;height:13%}.mouth{left:35%;top:70%;width:30%;height:13%}.face-palette{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.part-option{min-height:95px;background:#f4fbff}.part-option span{display:block;font-size:49px}.part-option.selected{border-color:#f2b957;background:#fff2ce}@media(max-width:550px){.face-game{grid-template-columns:1fr}.face-palette{grid-template-columns:repeat(4,1fr)}.part-option{min-height:75px;padding:5px}.part-option span{font-size:32px}} .blink-pair{position:relative;max-width:440px;height:290px;margin:16px auto}.blink-pair img{position:absolute;width:100%;height:100%;object-fit:contain}.eye-second{animation:eyeToggle 2.4s infinite;opacity:0}@keyframes eyeToggle{0%,20%{opacity:0}25%,85%{opacity:1}90%,100%{opacity:0}}.action-gif{display:block;max-width:440px;width:100%;height:290px;object-fit:contain;margin:16px auto;border-radius:20px;background:#f7fbff} .back-bar{max-width:1000px;margin:12px auto 0;padding:0 16px}.back-link{display:inline-block;background:#fff;border:2px solid #c9e3ef;border-radius:14px;padding:10px 16px;color:#27526a;text-decoration:none;font-weight:600}.back-link:hover{background:#e8f7ff;border-color:#67b5d6}</style></head><body><header><h1>🌼 认识五官</h1><p>看一看 · 听一听 · 指一指 · 说一说</p></header><div class="back-bar"><a class="back-link" href="../index.html">← 返回上层目录</a></div><nav id="nav"></nav><main class="wrap"><div class="panel" id="view"></div></main><div class="footer">中文启蒙 · 第4次课复习</div><script id="tts-texts" type="application/json">["再试一次！", "嘴巴", "嘴巴！答对了，你真棒！", "太棒啦！", "头", "头！答对了，你真棒！", "张开嘴巴！", "我有一个鼻子。", "我有一张嘴巴。", "我有两只眼睛。", "我有两只耳朵。", "我有很多头发。", "拍拍头！", "捂住耳朵！", "摸摸鼻子！", "放开耳朵！", "眼睛", "眼睛！答对了，你真棒！", "睁开眼睛！", "耳朵", "耳朵！答对了，你真棒！", "请找出嘴巴。", "请找出头。", "请找出眼睛。", "请找出耳朵。", "请找出鼻子。", "这是什么？", "这是嘴巴。", "这是头。", "这是眼睛。", "这是耳朵。", "这是鼻子。", "闭上嘴巴！", "闭上眼睛！", "鼻子", "鼻子鼻子，嘴巴！", "鼻子鼻子，头！", "鼻子鼻子，眼睛！", "鼻子鼻子，耳朵！", "鼻子鼻子，鼻子！", "鼻子！答对了，你真棒！"]</script>
<script src="audio/tts-manifest.js"></script>
<script>
const parts=[{name:'头',sv:'huvud',img:'s8_2.webp',say:'这是头。'},{name:'嘴巴',sv:'mun',img:'s9_5.webp',say:'这是嘴巴。'},{name:'鼻子',sv:'näsa',img:'s11_2.webp',say:'这是鼻子。'},{name:'眼睛',sv:'ögon',img:'s13_2.webp',say:'这是眼睛。'},{name:'耳朵',sv:'öra',img:'s17_3.webp',say:'这是耳朵。'}];
const actions=['张开嘴巴','闭上嘴巴','睁开眼睛','闭上眼睛','捂住耳朵','放开耳朵','摸摸鼻子','拍拍头'];
const tabs=['认识五官','听音找图','动一动','鼻子鼻子','说一说'];let tab=0,idx=0,score=0,answer='',last=-1;
const asset=n=>'assets/'+n;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
let currentAudio=null;
function speak(s){
 if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}
 if('speechSynthesis' in window)speechSynthesis.cancel();
 const file=window.TTS_AUDIO&&window.TTS_AUDIO[s];
 if(file){const a=new Audio('audio/'+file);currentAudio=a;a.play().catch(()=>{if(currentAudio===a)fallback(s)});}
 else fallback(s);
}
function fallback(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}}
function btn(s,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${esc(s)}</button>`}function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>btn(t,`go(${i})`,tab===i?'active':'')).join('');const v=document.getElementById('view');if(tab===0){v.innerHTML=`<h2>👀 认识五官</h2><p class="lead">点击图片，听一听，再指一指自己的五官。</p><div class="grid">${parts.map((p,i)=>`<button class="tile" onclick="speak(parts[${i}].say)"><img src="${asset(p.img)}" alt="${p.name}"><h3>${p.name}</h3><div class="muted">${p.sv}</div><div>🔊 听一听</div></button>`).join('')}</div><div class="actions">${btn('🔊 这是什么？',"speak('这是什么？')")}</div>`}
if(tab===1)quiz(v);
if(tab===2){let a=actions[idx%actions.length];let media={'张开嘴巴':'s10_0.gif','闭上嘴巴':'s10_1.gif','摸摸鼻子':'s12_0.gif','捂住耳朵':'close ear.png','放开耳朵':'s17_3.webp','拍拍头':'s8_2.webp'};let visual=(a==='睁开眼睛'||a==='闭上眼睛')?`<div class="blink-pair"><img class="eye-first" src="${asset(a==='睁开眼睛'?'close eyes.gif':'open eyes.gif')}" alt="眼睛动作"><img class="eye-second" src="${asset(a==='睁开眼睛'?'open eyes.gif':'close eyes.gif')}" alt="眼睛动作"></div>`:`<img class="action-gif" src="${asset(media[a])}" alt="${a}">`;v.innerHTML=`<h2>🙌 动一动</h2><p class="lead">听口令，跟着做动作！</p><div class="prompt">${a}！</div>${visual}<div class="actions">${btn('🔊 再听一遍',`speak('${a}！')`,'primary')}${btn('上一个动作','prev()')}${btn('下一个动作','next()')}</div>`}
if(tab===3){let p=parts[idx%5];v.innerHTML=`<h2>🎯 鼻子鼻子……</h2><p class="lead">先把手放在鼻子上，听到口令后，马上指向正确的部位！</p><div class="prompt">鼻子鼻子，${p.name}！</div><img class="face" src="${asset(p.img)}" alt="${p.name}"><div class="actions">${btn('🔊 听老师说',`speak('鼻子鼻子，${p.name}！')`,'primary')}${btn('下一轮','next()')}</div>`}
if(tab===4){let s=['我有一个鼻子。','我有一张嘴巴。','我有两只眼睛。','我有两只耳朵。','我有很多头发。'];let p=s[idx%5];v.innerHTML=`<h2>💬 说一说</h2><p class="lead">听一听，跟着说，再试着自己说。</p><div class="prompt">${p}</div><div class="actions">${btn('🔊 听句子',`speak('${p}')`,'primary')}${btn('下一句','next()')}</div><div class="sentence">${parts.map((x,i)=>btn(x.name,`speak('${x.name}')`)).join('')}</div><p class="feedback">你能指给爸爸妈妈看吗？</p>`}}
function go(n){tab=n;idx=0;score=0;answer='';render();if(n===1)setTimeout(()=>speak('请找出'+parts[idx%5].name+'。'),150);if(n===3)setTimeout(()=>speak('鼻子鼻子，'+parts[idx%5].name+'！'),150);if(n===2)setTimeout(()=>speak(actions[idx%actions.length]+'！'),150)};function next(){idx++;answer='';render();if(tab===1)setTimeout(()=>speak('请找出'+parts[idx%5].name+'。'),150);if(tab===3)setTimeout(()=>speak('鼻子鼻子，'+parts[idx%5].name+'！'),150);if(tab===2)setTimeout(()=>speak(actions[idx%actions.length]+'！'),150)}function prev(){idx=(idx+actions.length-1)%actions.length;render();if(tab===2)setTimeout(()=>speak(actions[idx%actions.length]+'！'),150)};function found(){document.getElementById('fb').textContent='太棒啦！';speak('太棒啦！');setTimeout(next,950)}
function quiz(v){let target=parts[idx%5],opts=[target];for(let k=1;k<4;k++)opts.push(parts[(idx+k)%5]);opts.sort((a,b)=>((a.name.charCodeAt(0)+idx*13)%17)-((b.name.charCodeAt(0)+idx*13)%17));v.innerHTML=`<h2>🔊 听音找图</h2><p class="lead">听一听，选出正确的图片。</p><div class="progress">第 ${idx+1} 题 · 已答对 ${score} 题</div><div class="actions">${btn('🔊 听题目',`speak('请找出${target.name}。')`,'primary')}</div><div class="grid">${opts.map(p=>`<button class="tile choice" onclick="choose('${p.name}',this)"><img src="${asset(p.img)}" alt="五官图片"><span class="small">点这里</span></button>`).join('')}</div><p class="feedback" id="fb"></p><div class="actions">${btn('下一题','next()')}</div>`}
function choose(name,el){if(answer)return;let target=parts[idx%5].name;if(name===target){answer=name;score++;el.classList.add('correct');document.getElementById('fb').textContent=`${name}！答对了，你真棒！`;speak(`${name}！答对了，你真棒！`)}else{el.classList.add('wrong');document.getElementById('fb').textContent='再试一次！';speak('再试一次！');setTimeout(()=>el.classList.remove('wrong'),600)}}

render();
</script></body></html>
